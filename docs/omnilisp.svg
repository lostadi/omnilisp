<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">OmniLisp</title>
  <desc id="desc">Read the forms. Follow the evaluation. Inspect the output.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11111b"/><stop offset="1" stop-color="#1e1e2e"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cdd6f4" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#313244"/>
  <g font-family="'SFMono-Regular',Consolas,monospace">
    <text x="58" y="68" font-size="13" letter-spacing="3" fill="#a6adc8">A LISP WORKBENCH YOU CAN LOOK INSIDE</text>
    <text x="54" y="169" font-size="86" letter-spacing="-4" font-weight="700" fill="#cdd6f4">Omni<tspan fill="#cba6f7">Lisp</tspan></text>
    <text x="60" y="224" font-size="19" fill="#bac2de">Read the forms. Follow the evaluation.</text>
    <text x="60" y="255" font-size="19" fill="#bac2de">Inspect the output.</text>
    <text x="60" y="321" font-size="11" letter-spacing="2" fill="#6c7086">LEE DAGHLAR OSTADI</text>
    <rect x="760" y="82" width="442" height="198" rx="14" fill="#181825" stroke="#45475a"/>
    <circle cx="785" cy="105" r="4" fill="#f38ba8"/><circle cx="801" cy="105" r="4" fill="#f9e2af"/><circle cx="817" cy="105" r="4" fill="#a6e3a1"/>
    <text x="788" y="161" font-size="23" fill="#cba6f7">(print <tspan fill="#89b4fa">(factorial 6)</tspan>)</text>
    <text x="788" y="207" font-size="23" fill="#a6e3a1">=&gt; 720</text>
    <text x="788" y="249" font-size="12" letter-spacing="2" fill="#a6adc8">FORMS · ENVIRONMENTS · SOURCE</text>
  </g>
</svg>
